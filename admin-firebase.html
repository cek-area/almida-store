<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Firebase · ALMIDA STORE</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#19233b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #dfe5ef;padding:17px max(16px,calc((100vw - 1000px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:19px;margin:0}small,.muted{color:#68758a}.wrap{max-width:1000px;margin:22px auto;padding:0 14px}.panel{background:#fff;border:1px solid #dfe5ef;border-radius:16px;padding:19px;margin-bottom:16px}h2{font-size:17px;margin:0 0 13px}label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid #cad3e0;border-radius:9px}textarea{min-height:80px}button{border:0;border-radius:10px;padding:11px 15px;background:#245bf0;color:white;font:inherit;font-weight:650;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#e9eefb;color:#24416d}.danger{background:#fce8e8;color:#9e2222}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.check{display:flex;align-items:center;gap:7px;margin-top:15px}.check input{width:auto}.notice{background:#f0f5ff;padding:11px;border-radius:10px;font-size:13px;margin:12px 0}.product{border:1px solid #e2e7ef;border-radius:12px;padding:12px;margin-top:9px;display:flex;justify-content:space-between;gap:12px;align-items:center}.product strong{display:block}.product small{display:block;margin-top:4px}.hidden{display:none!important}#status{white-space:pre-wrap;font-size:13px}a{color:#245bf0}@media(max-width:650px){.grid{grid-template-columns:1fr}.product{align-items:flex-start;flex-direction:column}}
</style></head><body><header><div><h1>ALMIDA STORE · Admin Firebase</h1><small>Panel pengelolaan katalog online</small></div><button class="secondary hidden" id="logout">Keluar</button></header><main class="wrap"><div class="notice">Versi pengujian terpisah. Website utama tidak diubah. Hanya akun yang UID-nya diizinkan Firestore Rules yang dapat menyimpan perubahan.</div><section class="panel" id="loginPanel"><h2>Login Admin</h2><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><div class="row" style="margin-top:14px"><button id="loginBtn">Masuk</button></div></form></section><p id="status" role="status"></p><div id="dashboard" class="hidden"><section class="panel"><h2 id="formHeading">Tambah Produk</h2><form id="productForm"><input id="editingId" type="hidden"><label>Nama produk *</label><input id="name" maxlength="140" required placeholder="Contoh: Tri Happy 20GB 3 Hari"><div class="grid"><div><label>Operator *</label><select id="operator"><option>Telkomsel</option><option>Indosat</option><option>XL</option><option>AXIS</option><option>Tri</option><option>Smartfren</option><option>by.U</option></select></div><div><label>Kategori *</label><select id="category"><option>Paket data</option><option>Masa aktif</option><option>Aplikasi premium</option><option>Produk digital lainnya</option></select></div></div><div class="grid"><div><label>Harga jual (Rp) *</label><input id="price" type="number" min="1" max="100000000" step="1" required></div><div><label>Harga coret (opsional)</label><input id="oldPrice" type="number" min="0" max="100000000" step="1" value="0"></div></div><div class="grid"><div><label>Masa aktif (hari)</label><input id="durationDays" type="number" min="0" max="365" step="1" placeholder="7"></div><div><label>Kode SKU (opsional)</label><input id="sku" maxlength="100" placeholder="Kode dari supplier"></div></div><label>Deskripsi kuota / syarat *</label><textarea id="description" maxlength="800" required placeholder="Jelaskan kuota utama, kuota lokal, FUP, batas harian, dll."></textarea><div class="grid"><div><label>Emoji</label><input id="emoji" maxlength="8" value="📱"></div><div><label>URL gambar (opsional)</label><input id="image" type="url" placeholder="https://..."></div></div><div class="row"><label class="check"><input id="active" type="checkbox" checked> Produk aktif (publik)</label><label class="check"><input id="promo" type="checkbox"> Promo</label></div><div class="row" style="margin-top:14px"><button id="saveBtn">Simpan ke Firebase</button><button type="button" class="secondary" id="clearBtn">Bersihkan</button></div></form></section><section class="panel"><h2>Daftar Produk <span id="count"></span></h2><label>Cari produk</label><input id="search" placeholder="Nama, operator, SKU"><div id="list"></div></section></div></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getFirestore,collection,getDocs,addDoc,doc,updateDoc,deleteDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyC5q-ldCysUCKroQkWdXsMS03CiAh8C9S4',authDomain:'almida-store-3ed15.firebaseapp.com',projectId:'almida-store-3ed15',storageBucket:'almida-store-3ed15.firebasestorage.app',messagingSenderId:'345123910939',appId:'1:345123910939:web:72c9e8a3f242aa5369cfbe'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);let items=[];const status=(msg,error=false)=>{$('status').textContent=msg;$('status').style.color=error?'#b91c1c':'#14532d'};const money=n=>'Rp'+Number(n||0).toLocaleString('id-ID');const errorText=e=>({ 'auth/invalid-credential':'Email atau password salah.','auth/too-many-requests':'Terlalu banyak percobaan. Coba lagi nanti.','permission-denied':'Izin ditolak. Pastikan UID akun admin cocok dengan Firestore Rules.','auth/unauthorized-domain':'Domain belum diizinkan di Authentication → Settings → Authorized domains.'}[e.code]||e.message||String(e));
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;status('Memeriksa login...');try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('password').value=''}catch(err){status(errorText(err),true)}finally{$('loginBtn').disabled=false}};
$('logout').onclick=()=>signOut(auth);onAuthStateChanged(auth,async user=>{$('loginPanel').classList.toggle('hidden',!!user);$('dashboard').classList.toggle('hidden',!user);$('logout').classList.toggle('hidden',!user);if(user){status('Login berhasil. Memuat produk...');await load()}else{items=[];status('Silakan login dengan akun admin Firebase.')}});
async function load(){try{const snap=await getDocs(collection(db,'products'));items=snap.docs.map(d=>({id:d.id,...d.data()}));status('Terhubung ke Firestore. '+items.length+' produk ditemukan.');render()}catch(e){status('Gagal membaca produk: '+errorText(e),true);render()}}
function reset(){ $('productForm').reset();$('editingId').value='';$('formHeading').textContent='Tambah Produk';$('saveBtn').textContent='Simpan ke Firebase';$('emoji').value='📱';$('active').checked=true;$('oldPrice').value='0'}
$('clearBtn').onclick=reset;$('search').oninput=render;
function render(){const q=$('search').value.trim().toLowerCase();const filtered=items.filter(p=>[p.name,p.operator,p.sku].join(' ').toLowerCase().includes(q));$('count').textContent='('+items.length+')';$('list').replaceChildren();if(!filtered.length){const p=document.createElement('p');p.className='muted';p.textContent='Belum ada produk yang cocok.';$('list').append(p)}for(const p of filtered){const article=document.createElement('article');article.className='product';const info=document.createElement('div');const title=document.createElement('strong');title.textContent=p.name||'Tanpa nama';const meta=document.createElement('small');meta.textContent=[p.operator,p.category,money(p.price),p.active===true?'Aktif':'Nonaktif',p.sku?'SKU: '+p.sku:''].filter(Boolean).join(' · ');info.append(title,meta);const buttons=document.createElement('div');buttons.className='row';const edit=document.createElement('button');edit.className='secondary';edit.textContent='Edit';edit.onclick=()=>editItem(p);const toggle=document.createElement('button');toggle.className='secondary';toggle.textContent=p.active?'Nonaktifkan':'Aktifkan';toggle.onclick=()=>changeActive(p);const del=document.createElement('button');del.className='danger';del.textContent='Hapus';del.onclick=()=>removeItem(p);buttons.append(edit,toggle,del);article.append(info,buttons);$('list').append(article)}}
function editItem(p){$('editingId').value=p.id;for(const key of ['name','operator','category','price','oldPrice','durationDays','sku','description','emoji','image'])$(key).value=p[key]??'';$('active').checked=p.active===true;$('promo').checked=p.promo===true;$('formHeading').textContent='Edit Produk';$('saveBtn').textContent='Simpan Perubahan';window.scrollTo({top:0,behavior:'smooth'})}
async function changeActive(p){try{await updateDoc(doc(db,'products',p.id),{active:!p.active,updatedAt:serverTimestamp()});await load()}catch(e){status('Gagal mengubah status: '+errorText(e),true)}}
async function removeItem(p){if(!confirm('Hapus permanen produk "'+p.name+'"?'))return;try{await deleteDoc(doc(db,'products',p.id));status('Produk dihapus.');await load()}catch(e){status('Gagal menghapus: '+errorText(e),true)}}
$('productForm').onsubmit=async e=>{e.preventDefault();const id=$('editingId').value;const price=Number($('price').value),oldPrice=Number($('oldPrice').value||0),days=$('durationDays').value?Number($('durationDays').value):0;if(!Number.isInteger(price)||price<=0||!Number.isInteger(oldPrice)||oldPrice<0||!Number.isInteger(days)||days<0){status('Harga dan masa aktif harus berupa angka bulat yang valid.',true);return}const data={name:$('name').value.trim(),operator:$('operator').value,category:$('category').value,price,oldPrice,durationDays:days,sku:$('sku').value.trim(),description:$('description').value.trim(),emoji:$('emoji').value.trim()||'📱',image:$('image').value.trim(),active:$('active').checked,promo:$('promo').checked,updatedAt:serverTimestamp()};if(!data.name||!data.description){status('Nama dan deskripsi wajib diisi.',true);return}$('saveBtn').disabled=true;status('Menyimpan ke Firebase...');try{if(id)await updateDoc(doc(db,'products',id),data);else await addDoc(collection(db,'products'),{...data,createdAt:serverTimestamp()});reset();await load();status('Produk berhasil disimpan ke Firebase.')}catch(err){status('Gagal menyimpan: '+errorText(err),true)}finally{$('saveBtn').disabled=false}};
</script></body></html>
