<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Uji Katalog Firebase · ALMIDA STORE</title><style>body{font:16px/1.5 system-ui,sans-serif;background:#f4f7fc;color:#1d2a43;margin:0;padding:20px}.wrap{max-width:750px;margin:auto}.card{background:#fff;border:1px solid #e1e6f0;border-radius:14px;padding:16px;margin:12px 0}h1{font-size:22px}small{color:#65738c}button{border:0;background:#205af1;color:white;border-radius:10px;padding:10px 15px;font:inherit}a{color:#205af1}#status{white-space:pre-wrap}</style></head><body><main class="wrap"><h1>ALMIDA STORE · Uji Katalog Firebase</h1><p>Halaman terpisah untuk memastikan pengunjung tanpa login dapat melihat <b>produk aktif saja</b>. Tidak mengubah website utama.</p><button id="reload">Muat Ulang Katalog</button><p id="status">Menghubungkan...</p><div id="products"></div></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import {getFirestore,collection,query,where,getDocs} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';const app=initializeApp({apiKey:'AIzaSyC5q-ldCysUCKroQkWdXsMS03CiAh8C9S4',authDomain:'almida-store-3ed15.firebaseapp.com',projectId:'almida-store-3ed15',storageBucket:'almida-store-3ed15.firebasestorage.app',messagingSenderId:'345123910939',appId:'1:345123910939:web:72c9e8a3f242aa5369cfbe'}),db=getFirestore(app);const $=id=>document.getElementById(id);async function load(){$('status').textContent='Memuat produk aktif dari Firestore...';$('products').replaceChildren();try{const snap=await getDocs(query(collection(db,'products'),where('active','==',true)));$('status').textContent=snap.size+' produk aktif berhasil dibaca tanpa login.';snap.forEach(d=>{const p=d.data(),card=document.createElement('article');card.className='card';const title=document.createElement('strong');title.textContent=p.name||'Produk';const detail=document.createElement('p');detail.textContent=[p.operator,'Rp'+Number(p.price||0).toLocaleString('id-ID'),p.description].filter(Boolean).join(' · ');card.append(title,detail);$('products').append(card)})}catch(e){$('status').textContent='Gagal membaca katalog: '+(e.message||e)}}$('reload').onclick=load;load();
</script></body></html>
